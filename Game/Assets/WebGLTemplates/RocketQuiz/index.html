<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05060a; }
      body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8ecf4; }
      #frame { position: relative; width: 100%; height: 100%; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #05060a; outline: none; touch-action: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 120%, #1a2440 0%, #05060a 60%); transition: opacity 0.4s; }
      #loading h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 0.04em; }
      #bar { width: 60%; max-width: 260px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff9a3c, #ffd36b); transition: width 0.2s; }
      #status { font-size: 13px; opacity: 0.6; }
      #error { position: absolute; left: 16px; right: 16px; bottom: 16px; display: none; padding: 12px; border-radius: 8px; background: #b3261e; font-size: 14px; }
      @media (min-aspect-ratio: 10/16) {
        /* Desktop / landscape: keep the portrait 9:16 frame centred. */
        #frame { width: calc(100vh * 9 / 16); height: 100vh; }
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <h1>🚀 {{{ PRODUCT_NAME }}}</h1>
        <div id="bar"><div id="fill"></div></div>
        <div id="status">Yükleniyor…</div>
      </div>
      <div id="error"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var errorBox = document.querySelector("#error");

      function showBanner(msg, type) {
        if (type !== "error") { console.warn(msg); return; }
        errorBox.textContent = msg;
        errorBox.style.display = "block";
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // Phones report 3x pixel ratios; 2x keeps the frame rate up with little visible loss.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = Math.round(100 * progress) + "%";
          if (progress >= 0.9) document.querySelector("#status").textContent = "Başlatılıyor…";
        }).then(function (instance) {
          var loading = document.querySelector("#loading");
          loading.style.opacity = "0";
          setTimeout(function () { loading.style.display = "none"; }, 400);
          canvas.focus();
        }).catch(function (message) {
          showBanner(String(message), "error");
        });
      };
      script.onerror = function () { showBanner("Oyun dosyaları yüklenemedi.", "error"); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
